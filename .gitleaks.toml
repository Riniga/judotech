# Extends the default gitleaks rule set.
[extend]
useDefault = true

[allowlist]
description = "Known test fixtures — NOT real credentials"
# local.settings_sample.json is deliberately NOT allowlisted: it must only ever
# hold a placeholder, so gitleaks catches a real key if one ever lands there.
paths = [
  '''source/judotech\.api\.tests/AuthenticationIntegrationTests\.cs''',
]
regexes = [
  # Fake PBKDF2 hash used as a test fixture, not a live credential.
  '''QuLWdRplKNXLjEz3IQyoJ8aGrY/OlPTOMWw2YidkzIk=''',
]
